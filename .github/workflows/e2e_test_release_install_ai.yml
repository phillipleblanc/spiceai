name: E2E Test Release Installation (AI)
on:
  workflow_dispatch:
    inputs:
      install_script_branch:
        description: 'Branch to use for install script (leave empty to use install.spiceai.org)'
        required: false
        type: string
        default: ''
      platform_option:
        description: 'Which platform do you want to run on? (Default is all)'
        required: false
        type: choice
        options:
          - 'all'
          - 'macOS aarch64 (GPU M4)'
          - 'Linux aarch64'
          - 'macOS aarch64'
        default: 'all'
  pull_request:
    paths:
      - 'install/install.sh'
      - 'install/Install.ps1'
      - '.github/workflows/e2e_test_release_install_ai.yml'
  push:
    branches:
      - trunk
    paths:
      - 'install/install.sh'
      - 'install/Install.ps1'
      - '.github/workflows/e2e_test_release_install_ai.yml'

jobs:
  setup-matrix:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: setup-matrix
        with:
          script: |
            const matrix = [
              {
                name: "macOS aarch64 (GPU M4)",
                runner: "spiceai-macos",
                target_os: "darwin",
                target_arch: "aarch64",
                tags: ["metal"]
              },
              {
                name: "Linux aarch64",
                runner: "hosted-linux-arm-runner",
                target_os: "linux",
                target_arch: "aarch64",
                tags: []
              },
              {
                name: "macOS aarch64",
                runner: "macos-15",
                target_os: "darwin",
                target_arch: "aarch64",
                tags: []
              }
            ];

            const platform_option = context.payload.inputs?.platform_option || 'all';
            let filtered = matrix;

            if (platform_option !== 'all') {
              filtered = filtered.filter(m => m.name === platform_option);
            }

            return filtered;

  test-install:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: system info
        run: uname -m

      - name: checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      # The aarch64 Linux runner does not have tools pre-installed
      - name: Install missing tools
        if: matrix.target.target_os == 'linux' && matrix.target.target_arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt install jq -y

      - name: CUDA version
        if: contains(matrix.target.tags, 'cuda')
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=compute_cap --format=csv

      # on self-hosted runners, there is a newer dev version installed, so we need to remove it first
      - name: remove existing release
        if: matrix.target.runner == 'spiceai-macos'
        run: |
          rm -rf ~/.spice/bin/

      - name: install Spice (https://install.spiceai.org)
        if: github.event_name == 'workflow_dispatch' && inputs.install_script_branch == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://install.spiceai.org | /bin/bash

      - name: install Spice (from branch)
        if: github.event_name != 'workflow_dispatch' || inputs.install_script_branch != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ inputs.install_script_branch || github.head_ref || github.ref_name }}"
          curl -sSL -H "Cache-Control: no-cache" "https://raw.githubusercontent.com/spiceai/spiceai/${BRANCH}/install/install.sh" | /bin/bash

      - name: add Spice bin to PATH
        run: |
          echo "$HOME/.spice/bin" >> $GITHUB_PATH

      - name: install AI runtime version
        run: |
          spice install ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: check installation
        run: |
          spice version

      - name: Init Spice app (OpenAI model)
        if: "!contains(matrix.target.tags, 'metal')"
        run: |
          cp ./test/models/spicepod_openai.yml ./spicepod.yaml
          cat ./spicepod.yaml

      # acceleration is currently supported for metal target only
      - name: Init Spice app (Huggingface model)
        if: contains(matrix.target.tags, 'metal')
        run: |
          cp ./test/models/spicepod_hf.yml ./spicepod.yaml
          cat ./spicepod.yaml

      - name: Start Spice runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICE_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
        run: |
          spice run &> spice.log &

      - name: Wait for Spice runtime is ready
        timeout-minutes: 3
        run: |
          while [[ "$(curl -s http://localhost:8090/v1/ready)" != "ready" ]]; do sleep 1; done

      - name: Install expect (linux)
        if: matrix.target.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Install expect (macOS)
        if: matrix.target.target_os == 'darwin'
        run: |
          brew install expect

      - name: Test vector search
        run: |
          ./test/models/search_01.exp

      - name: Test chat
        run: |
          ./test/models/chat_01_simple.exp

      - name: Stop spice and check logs
        if: always()
        run: |
          killall spice || true
          cat spice.log
